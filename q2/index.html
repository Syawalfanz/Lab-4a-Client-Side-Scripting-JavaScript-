<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lab 4a Q2: Smart Number Validator</title>
        <style>
             body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
             button { padding: 8px 16px; font-size: 1rem; cursor: pointer; margin-top: 8px; }
             input { padding: 8px; font-size: 1rem; }
             #result { font-weight: bold; margin-top: 16px; min-height: 1.2em; }
       </style>
       <script src="script.js" defer></script>
    </head>
    <body>
     <h1>Q2: Smart Number Validator</h1>

     <label for="userInput">Enter a number:</label>
    <input type="text" id="userInput" placeholder="Enter a number">
    <button id="checkBtn" type="button">Check</button>
    <p id="result" role="status" aria-live="polite"></p>
</body>
</html>
